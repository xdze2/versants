# Rioumajou — Neste de Rioumajou catchment, Hautes-Pyrénées.
# The whole render recipe. `valley diorama rioumajou --view SE01` regenerates
# everything under derived/ and writes rioumajou_SE01_3d.png next to this file.

[meta]
slug = "rioumajou"

[river]
# Stable BD TOPO cours d'eau id — resolvable offline from the troncon parquet.
id = "COURDEAU0000002000907013"
name = "Neste de Rioumajou"
troncons = "data/raw/troncon_hydrographique_pyrenees.parquet"

[catchment]
demtype = "COP30"
acc_channel_cells = 1000

[terrain]
exaggeration = 1.8           # vertical stretch — Pyrenean valleys read flat at iso angles
base_thickness_frac = 0.14   # solid plinth depth as a fraction of the z-span
pad_cells = 6                # apron of terrain kept outside the drainage divide

# ------------------------------------------------------------------- views
# One block per fixed camera set-up. The name (SE01) becomes the filename token.

[view.SE01]
camera_azimuth   = 135.0     # deg — viewer sits to the SE, looking NW up the valley
camera_elevation = 33.0      # deg above the horizon
ortho_margin     = 1.06      # ortho frustum = basin bbox * this
sun_azimuth      = 118.0     # morning sun, low from the ESE — long shadows down the cirques
sun_altitude     = 26.0
sun_hardness     = 0.5       # sun angular diameter, deg (0.53 ≈ real; higher = softer edges)
samples          = 64
resolution       = [1400, 1050]
background        = "#efe9dc"
show_streams      = true

# Labels: hand/AI placed. lon/lat in WGS84; the diorama projector drops them
# onto the surface at render time. (Label compositing is a later step — kept
# here so the placement work lands in version control now.)
[[view.SE01.labels]]
text = "Port de Vielle"
lon  = 0.3369
lat  = 42.6739

[[view.SE01.labels]]
text = "Pic de Bataillence"
lon  = 0.3520
lat  = 42.7060

[[view.SE01.labels]]
text = "Granges du Rioumajou"
lon  = 0.3117
lat  = 42.7570
