# First vertical slice: Gave de Pau headwaters / Cirque de Gavarnie (Hautes-Pyrénées).
name: gavarnie
description: Gave de Pau headwaters around the Cirque de Gavarnie

# Rough area of interest, lon/lat WGS84 (minx, miny, maxx, maxy).
bbox_wgs84: [-0.10, 42.65, 0.15, 42.85]

# Pour point to select the upstream watershed, lon/lat WGS84.
# Near the village of Gavarnie on the Gave de Pau — refine once the DEM is in.
pour_point_wgs84: [-0.0086, 42.7350]

# Working CRS for processing / export (Lambert-93, France).
crs: EPSG:2154

sources:
  wfs_endpoint: https://data.geopf.fr/wfs/ows
  watershed_layer: BDTOPO_V3:bassin_versant_topographique
