[project]
name = "valleespyr"
version = "0.1.0"
description = "3D visualization of Pyrénées mountain valleys from topographic and watershed data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "xdze2", email = "xdze2.me@gmail.com" }]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dem = [
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    "pysheds>=0.4",
]
render = ["rasterio>=1.3", "pysheds>=0.4", "matplotlib>=3.8", "pillow>=10.0"]
viz = [
    "pydeck>=0.9",
    "matplotlib>=3.8",
]
app = [
    "streamlit>=1.30",
    "pydeck>=0.9",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
valleespyr = "valleespyr.cli:cli"

[project.gui-scripts]
valleespyr-app = "valleespyr.app:_run_streamlit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valleespyr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
